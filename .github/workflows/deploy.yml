name: Deploy Apps to Cloudflare Pages

on:
  push:
    branches: [feat/setup-monorepo]
    # branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      main-site: ${{ steps.changes.outputs.main-site }}
      blog: ${{ steps.changes.outputs.blog }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            main-site:
              - 'apps/eembouz.com/**'
              - 'packages/**'
            blog:
              - 'apps/blog.eembouz.com/**'
              - 'packages/**'

  deploy-main-site:
    needs: changes
    if: needs.changes.outputs.main-site == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build main site
        run: pnpm turbo run build --filter=eembouz.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/eembouz.com
          command: pages deploy apps/eembouz.com/dist --project-name=eembouz-com --branch=main

  deploy-blog:
    needs: changes
    if: needs.changes.outputs.blog == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build blog
        run: pnpm turbo run build --filter=blog.eembouz.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/blog.eembouz.com
          command: pages deploy apps/blog.eembouz.com/dist --project-name=blog-eembouz-com --branch=main
